<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/agri_white.svg" id="relIcon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agri-Farm Watering System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (() => {
        const savedTheme = localStorage.getItem("theme");
        const dark = savedTheme === "dark" || savedTheme === "black";
        const normalized = dark ? "dark" : "light";
        localStorage.setItem("theme", normalized);
        document.documentElement.dataset.theme = normalized;
        document.documentElement.classList.toggle("dark", dark);
        const relImage = document.getElementById("relIcon");
        if (relImage) relImage.href = dark ? "/agri_dark.svg" : "/agri_white.svg";
      })();
    </script>
  </body>
</html>
