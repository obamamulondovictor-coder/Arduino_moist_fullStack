<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/agri_white.svg" id="relIcon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agri-Farm Watering System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (() => {
        let savedTheme = localStorage.getItem("theme");
        if (!savedTheme) {
          savedTheme = "white";
          localStorage.setItem("theme", savedTheme);
        }
        if (savedTheme === "black") {
          savedTheme = "dark";
          localStorage.setItem("theme", savedTheme);
        }
        const relImage = document.getElementById("relIcon");
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
          if (relImage) relImage.href = "/agri_dark.svg";
        } else {
          document.documentElement.classList.remove("dark");
          if (relImage) relImage.href = "/agri_white.svg";
        }
      })();
    </script>
  </body>
</html>
